plugins { id 'com.android.application' }
android {
 namespace 'com.oddfactory.naia'
 compileSdk 35
 defaultConfig { applicationId 'com.oddfactory.naia'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildFeatures { buildConfig true }
 // Android Studio JBR(Java 25)로 빌드: AGP 8.5 lint가 Java 25에서 실패하므로 릴리스 lintVital을 끈다.
 lint { checkReleaseBuilds false; abortOnError false }
 androidResources { noCompress 'webp' }
}
